
name: CI-CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v5

      - name: Instalar Java 21 (Temurin) y cache de Maven
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Compilar y ejecutar los tests
        run: mvn -B clean verify

      - name: Publicar el .jar como artefacto de la ejecución
        uses: actions/upload-artifact@v6
        with:
          name: app-jar
          path: target/app.jar

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el .jar del job build
        uses: actions/download-artifact@v6
        with:
          name: app-jar

      - name: Desplegar en Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: p2gps-id8742c
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: app.jar
